<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walsh Residence · Splash Studies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<style>
  :root { --paper: #f6f5f1; --ink: #1b1a18; --muted: #6f6c65; --rule: #d6d3cc; --accent: #a8813f; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; font: 400 15px/1.4 'EB Garamond', Garamond, serif; }
  header { padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font: 400 15px/1.2 'Tenor Sans', sans-serif; letter-spacing: .28em; text-transform: uppercase; }
  header span { font: 400 10px/1.2 'Tenor Sans', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  main { display: grid; place-items: center; padding: 8px 16px; }
  .ld { display: grid; justify-items: center; gap: 6px; }
  .dial { position: relative; width: 240px; height: 240px; perspective: 720px; perspective-origin: 50% 40%; margin-bottom: 8px; }
  .stack, .comp, .mk, canvas, .shadow { position: absolute; inset: 0; }
  .stack, .comp { transform-style: preserve-3d; }
  canvas { width: 240px; height: 240px; }
  .mk { display: flex; align-items: center; justify-content: center; opacity: 0; }
  .lk { display: flex; flex-direction: column; align-items: flex-start; width: 69px; }
  .lk img.m { width: 100%; height: auto; }
  .lk img.n { width: 91.2%; margin-left: 8.7%; margin-top: 5px; opacity: 0; }
  .shadow { inset: auto; left: 50%; top: 100%; width: 190px; height: 26px; margin: -8px 0 0 -95px; border-radius: 50%; background: radial-gradient(closest-side, rgba(27,26,24,.16), rgba(27,26,24,0)); opacity: 0; }
  .name { margin: 4px 0 0; font: 400 34px/1.15 'Nothing You Could Do', cursive; }
  .sub { margin: 0; font: 400 10px/1.4 'Tenor Sans', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .desc { margin: 14px 0 0; max-width: 34ch; text-align: center; font-style: italic; color: var(--muted); min-height: 3.2em; }
  nav { padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px; justify-items: center; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tabs button, .replay { appearance: none; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; min-height: 40px; padding: 0 14px; font: 400 10.5px/1 'Tenor Sans', sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .replay { border-color: var(--rule); }
</style></head>
<body>
<header><h1>Splash studies</h1><span>Walsh Residence · 9/29/26</span></header>
<main><div class="ld">
  <div class="dial" id="dial"><div class="shadow" id="sh"></div><div class="stack">
    <div class="comp" id="compR"><canvas id="cR" width="840" height="840"></canvas></div>
    <div class="comp" id="compB"><canvas id="cB" width="840" height="840"></canvas></div>
    <div class="comp" id="compA"><canvas id="cA" width="840" height="840"></canvas></div>
    <div class="mk" id="mk"><span class="lk"><img class="m" src="marks/am10_mark.webp" alt=""><img class="n" id="nm" src="marks/am10_name.webp" alt=""></span></div>
  </div></div>
  <p class="name">Walsh Residence</p>
  <p class="sub">8154 Lahontan Drive · Lot 235 · Truckee</p>
  <p class="desc" id="desc"></p>
</div></main>
<nav>
  <div class="tabs" id="tabs"></div>
  <button type="button" class="replay" id="replay">Replay</button>
</nav>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const clampL = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const eOutL = (t, p = 3) => 1 - Math.pow(1 - t, p);
  const eBackL = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  function ldStrokes() {
    const ring = [], burst = [];
    const arc = (A, r, a0, a1, w, al) => { const p = []; for (let i = 0; i <= 120; i++) { const a = a0 + (a1 - a0) * i / 120; p.push([210 + Math.cos(a) * r, 210 + Math.sin(a) * r]); } A.push({ p, w, al }); };
    const line = (A, x0, y0, x1, y1, w, al) => A.push({ p: [[x0, y0], [x1, y1]], w, al });
    // a drafting construction: a compass circle, overshooting cross hairs and tick marks, drawn in pencil
    arc(ring, 150, -2.1, -2.1 + Math.PI * 2.04, 1.3, 0.85); arc(ring, 156, -1.2, -1.2 + Math.PI * 1.1, 0.7, 0.4);
    line(ring, 22, 210, 398, 210, 0.7, 0.45); line(ring, 210, 22, 210, 398, 0.7, 0.45);
    line(ring, 40, 332, 380, 88, 0.6, 0.3); line(ring, 60, 60, 360, 360, 0.5, 0.22);
    for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2, r0 = k % 6 ? 146 : 140; line(ring, 210 + Math.cos(a) * r0, 210 + Math.sin(a) * r0, 210 + Math.cos(a) * 154, 210 + Math.sin(a) * 154, k % 6 ? 0.6 : 1.1, 0.7); }
    // a fine starburst around the mark, echoing the compass on the site
    for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2, r1 = k % 6 ? (k % 2 ? 78 : 86) : 98; line(burst, 210 + Math.cos(a) * 70, 210 + Math.sin(a) * 70, 210 + Math.cos(a) * r1, 210 + Math.sin(a) * r1, k % 6 ? 0.45 : 0.8, k % 6 ? 0.28 : 0.5); }
    arc(burst, 64, 0, Math.PI * 2, 0.6, 0.35);
    return { ring, burst };
  }
  function ldDraw(c, strokes, prog) {
    const g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 420, 420);
    g.lineCap = 'round'; g.strokeStyle = '#1b1a18';
    const n = strokes.length;
    strokes.forEach((s, i) => {
      const f = clampL((prog - 0.5 * i / n) / 0.5);
      if (f <= 0) return;
      g.globalAlpha = s.al; g.lineWidth = s.w * 2; g.beginPath();
      if (s.p.length === 2) { const [a, b] = s.p; g.moveTo(a[0], a[1]); g.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f); }
      else s.p.slice(0, Math.max(2, Math.ceil(s.p.length * f))).forEach((q, j) => j ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]));
      g.stroke();
    });
    g.globalAlpha = 1;
  }
  function ldArrow(c, e) {
    // north arrow (André 9/28 7:32 pm): true north from the CAD, about 39 degrees east of plan up, so it points to the NE
    const g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 420, 420);
    if (e <= 0) return;
    const NA = (39.3 - 90) * Math.PI / 180, ca = Math.cos(NA), sa = Math.sin(NA);
    const P = r => [210 + ca * r, 210 + sa * r], Q = (r, off) => [210 + ca * r - sa * off, 210 + sa * r + ca * off];
    g.lineCap = 'round'; g.strokeStyle = '#1b1a18'; g.lineWidth = 2.2; g.globalAlpha = 0.9;
    const [a0, a1] = P(66), [b0, b1] = P(66 + (178 - 66) * e);
    g.beginPath(); g.moveTo(a0, a1); g.lineTo(b0, b1); g.stroke();
    g.lineWidth = 1.1; g.globalAlpha = 0.45;
    const [c0, c1] = P(-66), [d0, d1] = P(-66 - 40 * e);
    g.beginPath(); g.moveTo(c0, c1); g.lineTo(d0, d1); g.stroke();
    g.beginPath(); g.arc(...P(-110 * Math.max(0.6, e)), 4.5, 0, 7); g.stroke();
    g.globalAlpha = 1;
    if (e > 0.85) {
      const k = Math.min(1, (e - 0.85) / 0.15), tip = P(178 + 18 * k), l = Q(160, -9), r = Q(160, 9), m = P(166);
      g.fillStyle = '#a8813f'; g.beginPath(); g.moveTo(...tip); g.lineTo(...r); g.lineTo(...m); g.closePath(); g.fill();
      g.strokeStyle = '#1b1a18'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(...tip); g.lineTo(...l); g.lineTo(...m); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(...tip); g.lineTo(...r); g.stroke();
      g.globalAlpha = k; g.fillStyle = '#a8813f'; g.font = 'italic 500 30px "EB Garamond", Garamond, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const nP = Q(204, 0); g.fillText('N', nP[0], nP[1]); g.globalAlpha = 1;
    }
  }

  const D = 5.0, HOLD = 1.6;
  const S = ldStrokes();
  const dec = (t, p) => Math.pow(1 - t, p);
  const V = {
    A: { name: 'Precession', desc: 'The dial spins in tilted, and its tilt axis sweeps round and round like a top, wobbling lower each turn until it lands flat.',
      f: t => { const th = 68 * dec(t, 1.5), ph = 1000 * (1 - dec(t, 2)), sp = -720 * dec(t, 2.2);
        const w = `rotateZ(${ph}deg) rotateX(${th}deg) rotateZ(${-ph}deg)`;
        return { R: w + ` rotateZ(${sp}deg)`, B: w + ` rotateZ(${sp * 0.6}deg)`, A: w + ` rotateZ(${sp}deg)`, M: `translateZ(${80 * dec(t, 1.4)}px) ` + w + ` rotateZ(${540 * dec(t, 2.2)}deg)` }; } },
    B: { name: 'Spinning top', desc: 'A nodding wobble: the tilt bobs up and down as it spins, each nod smaller, the mark counter spinning above it.',
      f: t => { const env = Math.exp(-3.2 * t), th = 16 + 48 * env * Math.abs(Math.cos(7 * Math.PI * t)); const k = th * (1 - clampL((t - 0.8) / 0.2)) ;
        const ph = 820 * (1 - dec(t, 1.8)), sp = -900 * dec(t, 2);
        const w = `rotateZ(${ph}deg) rotateX(${k}deg) rotateZ(${-ph}deg)`;
        return { R: w + ` rotateZ(${sp}deg)`, B: w + ` rotateZ(${-sp * 0.4}deg)`, A: w + ` rotateZ(${sp}deg)`, M: `translateZ(${60 * env}px) ` + w + ` rotateZ(${720 * dec(t, 2)}deg)` }; } },
    C: { name: 'Gimbal', desc: 'Three rings on their own axes, like a gyroscope in its gimbal: ring, burst and arrow swing out of phase, then line up.',
      f: t => { const a = 78 * dec(t, 1.3);
        return { R: `rotateX(${a * Math.cos(5 * Math.PI * t)}deg) rotateY(${a * 0.4 * Math.sin(3 * Math.PI * t)}deg) rotateZ(${-540 * dec(t, 2)}deg)`,
                 B: `rotateY(${a * Math.sin(4 * Math.PI * t + 1)}deg) rotateX(${a * 0.3 * Math.cos(2 * Math.PI * t)}deg)`,
                 A: `rotateX(${a * 0.6 * Math.sin(6 * Math.PI * t)}deg) rotateZ(${-360 * dec(t, 2)}deg)`,
                 M: `translateZ(${70 * dec(t, 1.5)}px) rotateY(${720 * dec(t, 2.4)}deg) rotateX(${a * 0.4 * Math.cos(5 * Math.PI * t)}deg)` }; } },
    D: { name: 'Coin settling', desc: 'Like a coin settling on a table: the tilt drops steadily while the wobble speeds up, a quick rattle, then still.',
      f: t => { const th = 74 * dec(t, 1.15), ph = 2600 * t * t * (1 - 0.35 * t);
        const w = `rotateZ(${ph}deg) rotateX(${th}deg) rotateZ(${-ph}deg)`;
        return { R: w, B: w + ` rotateZ(${-200 * t}deg)`, A: w, M: `translateZ(${12 * dec(t, 1)}px) ` + w + ` rotateZ(${360 * dec(t, 2)}deg)` }; } },
    E: { name: 'Orbit and land', desc: 'The mark flies a shrinking orbit around the wobbling compass, then drops into the center; the name follows.',
      f: t => { const th = 40 * dec(t, 1.4), ph = 600 * t, R = 150 * dec(clampL(t / 0.85), 1.6), an = 900 * (1 - dec(t, 1.7)) * Math.PI / 180;
        const w = `rotateZ(${ph}deg) rotateX(${th}deg) rotateZ(${-ph}deg)`;
        return { R: w + ` rotateZ(${-360 * dec(t, 2)}deg)`, B: w, A: w, M: `translate3d(${R * Math.cos(an)}px, ${R * 0.45 * Math.sin(an)}px, ${R * 0.6 * Math.sin(an)}px) rotateY(${40 * dec(t, 1.5) * Math.sin(an)}deg) rotateZ(${-40 * dec(t, 1.5)}deg)` }; } }
  };
  const keys = Object.keys(V); let cur = 'A', t0 = 0, raf = 0;
  const tabs = $('#tabs');
  keys.forEach(k => { const b = document.createElement('button'); b.type = 'button'; b.textContent = k + ' · ' + V[k].name; b.dataset.k = k; b.addEventListener('click', () => play(k)); tabs.appendChild(b); });
  function paint(t) {
    const m = V[cur].f(t);
    $('#compR').style.transform = m.R; $('#compB').style.transform = m.B; $('#compA').style.transform = m.A; $('#mk').style.transform = m.M;
    $('#mk').style.opacity = clampL((t - 0.02) / 0.2); $('#nm').style.opacity = clampL((t - 0.86) / 0.12);
    $('#sh').style.opacity = t < 1 ? 0.8 * (1 - t) : 0;
    ldDraw($('#cR'), S.ring, clampL(t / 0.55)); ldDraw($('#cB'), S.burst, clampL((t - 0.15) / 0.5)); ldArrow($('#cA'), clampL((t - 0.45) / 0.45));
  }
  function play(k) {
    cur = k || cur; $('#desc').textContent = V[cur].desc;
    tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === cur)));
    cancelAnimationFrame(raf); t0 = performance.now();
    const tick = now => { const el = (now - t0) / 1000, t = clampL(el / D); paint(t); if (el < D + HOLD) raf = requestAnimationFrame(tick); else play(cur); };
    raf = requestAnimationFrame(tick);
  }
  $('#replay').addEventListener('click', () => play());
  window.__ls = { freeze: (k, t) => { cancelAnimationFrame(raf); cur = k; paint(t); } };
  play('A');
})();
</script>
</body></html>
