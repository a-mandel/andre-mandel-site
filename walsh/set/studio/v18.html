<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v18 Protractor head</title>
<meta name="description" content="ANDRÉ MANDEL title block study v18, Protractor head. Territory: Drafting machine and vellum.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v18 · Protractor head · Drafting machine and vellum */
.tb .up{position:absolute;left:calc(var(--u)*.3);right:calc(var(--u)*.26);display:flex;flex-direction:column;gap:calc(var(--u)*.22)}
.tb .dial{position:absolute;left:calc(var(--u)*.22);width:calc(var(--u)*3.02);height:calc(var(--u)*3.02);bottom:calc(var(--u)*1.34)}
.tb .dlab{position:absolute;left:calc(var(--u)*.3);right:calc(var(--u)*.26);bottom:calc(var(--u)*.98);display:flex;justify-content:space-between}
.tb .dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tb .dial .t{stroke:var(--ink);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}
.tb .dial .t.l{stroke-opacity:.8}
.tb .dial .ring{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1;vector-effect:non-scaling-stroke}
.tb .dial .ring.f{stroke-opacity:.18}
.tb .dial .arm{stroke:var(--accent);stroke-width:1.2;vector-effect:non-scaling-stroke}
.tb .dial .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tb .dial .sn{font-size:max(calc(34px*var(--fl)),calc(var(--u)*.86))}
.tb .dial .ang{position:absolute;font:400 var(--t-lab)/1 var(--ft);letter-spacing:.1em;color:var(--accent);white-space:nowrap}
.tb .dial .dn{position:absolute;font:400 max(calc(7px*var(--fl)),calc(var(--u)*.09))/1 var(--ft);color:var(--muted);transform:translate(-50%,-50%)}
.tb .low{position:absolute;left:calc(var(--u)*.3);right:calc(var(--u)*.26);bottom:calc(var(--u)*.26)}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v18', name: 'Protractor head',
  tb: c => {
    const R = 1.51, cx = 1.51, cy = 1.51;
    let t = '', dn = '';
    for (let a = 0; a < 360; a += 5) {
      const r1 = a % 30 === 0 ? 1.28 : a % 10 === 0 ? 1.36 : 1.41, rad = a * Math.PI / 180;
      t += `<line class="t${a % 30 === 0 ? ' l' : ''}" x1="${(cx + r1 * Math.cos(rad)).toFixed(3)}" y1="${(cy - r1 * Math.sin(rad)).toFixed(3)}" x2="${(cx + 1.47 * Math.cos(rad)).toFixed(3)}" y2="${(cy - 1.47 * Math.sin(rad)).toFixed(3)}"/>`;
      if (a % 90 === 0) dn += `<span class="dn" style="left:${(50 + 50 * 1.14 / R * Math.cos(rad)).toFixed(2)}%;top:${(50 - 50 * 1.14 / R * Math.sin(rad)).toFixed(2)}%">${a}</span>`;
    }
    const A = 53.6 * Math.PI / 180;
    const arm = `<line class="arm" x1="${(cx - 1.47 * Math.cos(A)).toFixed(3)}" y1="${(cy + 1.47 * Math.sin(A)).toFixed(3)}" x2="${(cx + 1.47 * Math.cos(A)).toFixed(3)}" y2="${(cy - 1.47 * Math.sin(A)).toFixed(3)}" stroke-dasharray="0.04 0.03" stroke-opacity=".7"/>`;
    const S = c.S, e = c.esc, sh = c.sh;
    return `<div class="up" style="top:${c.U(c.lockBottom - .5 + .34)}">${c.f.project()}${c.f.issued()}${c.f.permits()}${c.f.stamp()}${c.f.title()}</div>
      <div class="dial"><svg viewBox="0 0 3.02 3.02"><circle class="ring" cx="${cx}" cy="${cy}" r="1.47"/><circle class="ring f" cx="${cx}" cy="${cy}" r="1.02"/>${t}${arm}</svg>${dn}
        
        <div class="ctr"><div class="sn">${c.cells(sh.id)}</div></div></div>
      <div class="dlab"><span class="lab" style="white-space:nowrap">Sheet ${c.i + 1} of ${c.N}</span><span class="lab" style="color:var(--accent);white-space:nowrap">53.6°</span></div>
      <div class="low">${c.f.colo()}</div>`;
  }
});
</script>
</body>
</html>
