<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v14 Engraved plaque</title>
<meta name="description" content="ANDRÉ MANDEL title block study v14, Engraved plaque. Territory: Gallery label, museum placard.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v14 · Engraved plaque · Gallery label, museum placard */
.tb .plq{position:absolute;left:calc(var(--u)*.16);right:calc(var(--u)*.16);bottom:calc(var(--u)*.16);border:1px solid rgba(27,26,24,.5);border-radius:calc(var(--u)*.22);padding:calc(var(--u)*.08)}
.tb .plq .in{height:100%;border:1px solid rgba(27,26,24,.2);border-radius:calc(var(--u)*.15);display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--u)*.34) calc(var(--u)*.14) calc(var(--u)*.26)}
.tb .cap{font:400 var(--t-lab)/1.3 var(--ft);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.tb .nm{font:400 max(calc(13px*var(--fl)),calc(var(--u)*.24))/1.25 var(--ft);letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;margin:.35em 0 .2em;text-wrap:balance}
.tb .it{font:italic 400 var(--t-val)/1.4 var(--fs)}
.tb .it.m{color:var(--muted)}
.tb .orn{width:calc(var(--u)*.5);height:1px;background:var(--ink);opacity:.5;margin:calc(var(--u)*.26) auto}
.tb .orn.o{background:var(--accent);opacity:1;width:calc(var(--u)*.22)}
.tb .grow{flex:1}
.tb .seal{margin:.5em auto 0}
.tb .sn{font-size:max(calc(42px*var(--fl)),calc(var(--u)*1.2));margin:.1em 0 .05em;padding-left:.04em}
.tb .st{font:400 var(--t-lab)/1.3 var(--ft);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:.4em}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v14', name: 'Engraved plaque',
  tb: c => {
    const S = c.S, P = S.project, e = c.esc, sh = c.sh, F = S.firm;
    return `<div class="plq" style="top:${c.U(c.lockBottom - .5 + .28)}"><div class="in">
      <span class="cap">Project</span><div class="nm">${e(P.name)}</div>
      <div class="it">${e(P.site)}<br>${e(P.street)}<br>${e(P.city)} · ${e(P.county)}<br>APN ${e(P.apn)}<br>Zoning ${e(P.zoning)}<br>${e(P.owner)}<br>${e(P.ownerCo)}</div>
      <div class="orn"></div>
      <span class="cap">Issued</span>${c.iss.map((r, k) => `<div class="it${k ? ' m' : ''}">${r.no} · ${e(r.date)} · ${e(r.for)}</div>`).join('')}
      <div class="orn"></div>
      <span class="cap">Agency and permits</span><div class="it">Design review (LCC) · no. pending<br>Building permit · no. pending<br>${e(S.fire)}</div>
      <div class="orn"></div>
      <span class="cap">${e(S.aor.label)}</span><div class="it">${e(S.aor.name)}</div><div class="seal">Stamp</div><div class="it m" style="font-size:var(--t-sm)">${e(S.aor.note)}</div>
      <div class="grow"></div>
      <span class="cap">Sheet title</span><div class="nm">${e(sh.title)}</div><div class="it">${e(sh.scale)}<br>${e(S.date)} · drawn ${e(S.drawnBy)}</div>
      <div class="st">${e(S.status)}</div>
      <div class="orn o"></div>
      <span class="cap">Sheet ${c.i + 1} of ${c.N}</span><div class="sn">${c.cells(sh.id)}</div>
      <div class="it m" style="font-size:var(--t-sm);margin-top:.5em">${e(F.name)} · ${e(F.phone)} · ${e(F.email)}<br>${e(S.copy)}</div>
    </div></div>`;
  }
});
</script>
</body>
</html>
