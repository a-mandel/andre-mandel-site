<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v20 Scale bar and north</title>
<meta name="description" content="ANDRÉ MANDEL title block study v20, Scale bar and north. Territory: Drafting machine and vellum.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v20 · Scale bar and north · Drafting machine and vellum */
.tb .up{position:absolute;left:calc(var(--u)*.3);right:calc(var(--u)*.26);display:flex;flex-direction:column;gap:calc(var(--u)*.22)}
.tb .low{position:absolute;left:calc(var(--u)*.3);right:calc(var(--u)*.26);bottom:calc(var(--u)*.26);display:flex;flex-direction:column;gap:calc(var(--u)*.2)}
.tb .inst{position:relative;height:calc(var(--u)*1.34)}
.tb .inst svg{position:absolute;left:0;top:0;width:calc(var(--u)*3.0);height:calc(var(--u)*1.34);overflow:visible}
.tb .inst .s{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.tb .inst .fill{fill:var(--ink)}
.tb .inst .acc{stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.tb .inst .n{position:absolute;font:400 max(calc(8px*var(--fl)),calc(var(--u)*.1))/1 var(--ft);color:var(--muted);transform:translate(-50%,0);letter-spacing:.06em}
.tb .inst .cap{position:absolute;left:0;bottom:0;font:italic 400 var(--t-sm)/1 var(--fs);color:var(--muted);white-space:nowrap}
.tb .dim{position:absolute;left:0;right:0;height:calc(var(--u)*.3)}
.tb .dim svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tb .dim .s{stroke:var(--ink);stroke-opacity:.55;stroke-width:1;vector-effect:non-scaling-stroke}
.tb .dim span{position:absolute;left:50%;top:0;transform:translate(-50%,-10%);background:var(--paper);padding:0 .4em;font:italic 400 var(--t-sm)/1 var(--fs);color:var(--muted)}
.tb .low .sn{font-size:max(calc(42px*var(--fl)),calc(var(--u)*1.2))}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v20', name: 'Scale bar and north',
  tb: c => {
    // 3/16 in = 1 ft: 16 ft is exactly 3 in
    const ft = 3 / 16;
    let bars = '';
    [[0, 2], [4, 8]].forEach(([a, b], k) => { bars += `<rect class="fill" x="${a * ft}" y=".78" width="${(b - a) * ft}" height=".07"/>`; });
    const nums = [0, 2, 4, 8, 16].map(n => `<span class="n" style="left:calc(var(--u)*${(n * ft).toFixed(4)});top:calc(var(--u)*.58)">${n}</span>`).join('');
    const svg = `<svg viewBox="0 0 3 1.34"><rect class="s" x="0" y=".78" width="3" height=".07"/>${bars}
      <line class="s" x1="0" y1=".7" x2="0" y2=".93"/><line class="s" x1="3" y1=".7" x2="3" y2=".93"/>
      <circle class="s" cx="2.55" cy=".3" r=".24"/><path class="fill" d="M2.55 .02 L2.62 .36 L2.55 .31 L2.48 .36 Z"/><line class="acc" x1="2.55" y1=".58" x2="2.55" y2=".04"/></svg>`;
    const inst = `<div class="inst"><span class="lab" style="position:absolute;left:0;top:calc(var(--u)*.16)">Scale · feet</span>${svg}${nums}<span class="n" style="left:calc(var(--u)*2.55);top:calc(var(--u)*-.14)">N</span><span class="cap">${c.esc(c.sh.scale)} · true at 36 by 24 in</span></div>`;
    const dim = `<div class="dim" style="top:${c.U(c.lockBottom - .5 + .1)}"><svg viewBox="0 0 3.5 .3" preserveAspectRatio="none"><line class="s" x1=".05" y1=".15" x2="3.45" y2=".15"/><line class="s" x1="0" y1=".27" x2=".1" y2=".03"/><line class="s" x1="3.4" y1=".27" x2="3.5" y2=".03"/><line class="s" x1=".05" y1=".02" x2=".05" y2=".3"/><line class="s" x1="3.45" y1=".02" x2="3.45" y2=".3"/></svg><span>3 1/2 in</span></div>`;
    return `${dim}<div class="up" style="top:${c.U(c.lockBottom - .5 + .62)}">${c.f.project()}${c.f.issued()}${c.f.permits()}${c.f.stamp()}</div>
      <div class="low">${inst}${c.f.title()}${c.f.number()}${c.f.colo({ firm: true })}</div>`;
  }
});
</script>
</body>
</html>
