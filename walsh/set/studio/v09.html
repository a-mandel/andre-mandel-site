<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v09 Rounded cell stack</title>
<meta name="description" content="ANDRÉ MANDEL title block study v09, Rounded cell stack. Territory: CAD classic, rounded cells.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v09 · Rounded cell stack · CAD classic, rounded cells */
.tb .stack{position:absolute;left:calc(var(--u)*.14);right:calc(var(--u)*.14);bottom:calc(var(--u)*.14);display:flex;flex-direction:column;gap:calc(var(--u)*.1)}
.tb .cell{border:1px solid var(--hair);border-radius:calc(var(--u)*.13);padding:calc(var(--u)*.12) calc(var(--u)*.15) calc(var(--u)*.14)}
.tb .cell .lab{margin-bottom:.2em}
.tb .cell.grow{flex:1 1 auto;display:flex;flex-direction:column}
.tb .cell.grow .seal{flex:none;margin:auto;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);font-size:max(calc(8px*var(--fl)),calc(var(--u)*.12));border-width:1px}
.tb .cell.grow .sm{text-align:center}
.tb .row3{display:grid;grid-template-columns:1.1fr .9fr .6fr;column-gap:calc(var(--u)*.1)}
.tb .row3 .val{white-space:nowrap}
.tb .cell .sn{font-size:max(calc(40px*var(--fl)),calc(var(--u)*1.12))}
.tb .cell.num .lab b{font-weight:400}
.tb .cell .iss li{grid-template-columns:1.2em 4.6em 1fr}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v09', name: 'Rounded cell stack',
  tb: c => {
    const S = c.S, e = c.esc, sh = c.sh;
    const cell = (h, cl) => `<div class="cell ${cl || ''}">${h}</div>`;
    const inner = h => h.replace(/^<div class="sec[^"]*">/, '').replace(/<\/div>$/, '');
    return `<div class="stack" style="top:${c.U(c.lockBottom - .5 + .26)}">
      ${cell(inner(c.f.project()))}${cell(inner(c.f.issued()))}${cell(inner(c.f.permits()))}
      ${cell(`<span class="lab">${e(S.aor.label)}</span><span class="val line">${e(S.aor.name)}</span><div class="seal">Stamp</div><span class="sm line">${e(S.aor.note)}</span>`, 'grow')}
      ${cell(`<span class="lab">Sheet title</span><div class="stitle">${e(sh.title)}</div><div class="status">${e(S.status)}</div>`)}
      ${cell(`<div class="row3"><div><span class="lab">Scale</span><span class="val">${e(sh.scale)}</span></div><div><span class="lab">Date</span><span class="val">${e(S.date)}</span></div><div><span class="lab">Drawn</span><span class="val">${e(S.drawnBy)}</span></div></div>`)}
      ${cell(`<span class="lab">Sheet <b>${c.i + 1} of ${c.N}</b></span><div class="sn">${c.cells(sh.id)}</div>`, 'num')}
      ${cell(inner(c.f.colo({ firm: true })), 'colo')}
    </div>`;
  }
});
</script>
</body>
</html>
