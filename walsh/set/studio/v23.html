<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v23 Running head margin</title>
<meta name="description" content="ANDRÉ MANDEL title block study v23, Running head margin. Territory: Editorial and book typography.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v23 · Running head margin · Editorial and book typography */
.tb .spine{position:absolute;left:calc(var(--u)*.2);bottom:calc(var(--u)*.3);width:calc(var(--u)*.26);display:flex;align-items:flex-end;justify-content:center}
.tb .spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:400 var(--t-lab)/1 var(--ft);letter-spacing:.42em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tb .spine span b{font-weight:400;color:var(--accent)}
.tb .col{position:absolute;left:calc(var(--u)*.66);right:calc(var(--u)*.26);display:flex;flex-direction:column;gap:calc(var(--u)*.22)}
.tb .col.b{bottom:calc(var(--u)*.3)}
.tb .col .sn{font-size:max(calc(40px*var(--fl)),calc(var(--u)*1.08))}
.tb .col .stamp .seal{width:max(calc(34px*var(--fl)),calc(var(--u)*.74));height:max(calc(34px*var(--fl)),calc(var(--u)*.74))}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v23', name: 'Running head margin',
  tb: c => {
    const S = c.S, e = c.esc, sh = c.sh;
    const t = c.lockBottom - .5 + .36;
    return `<div class="spine" style="top:${c.U(t)}"><span>${e(S.project.name)} <b>·</b> ${e(sh.title)} <b>·</b> ${e(sh.id)} <b>·</b> ${e(S.firm.name)}</span></div>
      <div class="col" style="top:${c.U(t)}">${c.f.project()}${c.f.issued()}${c.f.permits()}${c.f.stamp()}</div>
      <div class="col b">${c.f.title()}${c.f.number()}${c.f.colo({ firm: true })}</div>`;
  }
});
</script>
</body>
</html>
