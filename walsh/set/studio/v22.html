<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v22 Italic title hero</title>
<meta name="description" content="ANDRÉ MANDEL title block study v22, Italic title hero. Territory: Editorial and book typography.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v22 · Italic title hero · Editorial and book typography */
.tb .ed{position:absolute;left:calc(var(--u)*.3);right:calc(var(--u)*.26);display:flex;flex-direction:column}
.tb .ed.b{bottom:calc(var(--u)*.28)}
.tb .h{font:italic 400 var(--t-val)/1.2 var(--fs);color:var(--accent);margin:0 0 .15em;display:flex;align-items:center;gap:.5em}
.tb .h::after{content:"";flex:1;height:1px;background:var(--rule)}
.tb .ed .blk + .blk{margin-top:calc(var(--u)*.22)}
.tb .ed p{margin:0;font:400 var(--t-val)/1.36 var(--fs);font-variant-numeric:oldstyle-nums}
.tb .ed p .m{color:var(--muted);font-style:italic}
.tb .hero{font:italic 400 max(calc(26px*var(--fl)),calc(var(--u)*.56))/1 var(--fs);letter-spacing:-.01em;margin:.05em 0 .15em;white-space:nowrap}
.tb .pn{font:400 max(calc(20px*var(--fl)),calc(var(--u)*.44))/1.05 var(--fs);margin:0 0 .15em}
.tb .snb{display:flex;align-items:baseline;justify-content:space-between;margin-top:calc(var(--u)*.2)}
.tb .snb .sn{font:400 max(calc(40px*var(--fl)),calc(var(--u)*1.1))/.9 var(--fs);letter-spacing:.01em}
.tb .snb .sn .fc{width:auto}
.tb .snb span{font:italic 400 var(--t-val)/1 var(--fs);color:var(--muted)}
.tb .ed .seal{float:right;margin-left:.5em}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v22', name: 'Italic title hero',
  tb: c => {
    const S = c.S, P = S.project, e = c.esc, sh = c.sh, F = S.firm;
    return `<div class="ed" style="top:${c.U(c.lockBottom - .5 + .36)}">
      <div class="blk"><div class="h">Project</div><div class="pn">${e(P.name)}</div><p>${e(P.site)}, ${e(P.street)}<br>${e(P.city)} · ${e(P.county)}<br>APN ${e(P.apn)} · ${e(P.zoning)}<br><span class="m">for ${e(P.owner)}, ${e(P.ownerCo)}</span></p></div>
      <div class="blk"><div class="h">Issued</div>${c.iss.map((r, k) => `<p${k ? ' style="color:var(--muted)"' : ''}>${r.no} · ${e(r.date)} · <i>${e(r.for)}</i></p>`).join('')}</div>
      <div class="blk"><div class="h">Agency</div><p>Design review (LCC) <span class="m">no. pending</span><br>Building permit <span class="m">no. pending</span><br>${e(S.fire)}</p></div>
      <div class="blk"><div class="h">Architect of record</div><p><span class="seal">Stamp</span>${e(S.aor.name)}<br><span class="m">${e(S.aor.note)}</span></p></div>
    </div>
    <div class="ed b">
      <div class="h">Sheet</div>
      <div class="hero">${e(sh.title)}</div>
      <p><span class="m">${e(sh.scale)} · ${e(S.date)} · drawn ${e(S.drawnBy)}</span></p>
      <div class="status">${e(S.status)}</div>
      <div class="snb"><div class="sn">${e(sh.id)}</div><span>${c.i + 1} of ${c.N}</span></div>
      <p style="margin-top:.9em;font-size:var(--t-sm);color:var(--muted)">${e(F.name)} · ${e(F.line)} · ${e(F.phone)}<br>${e(S.copy)}</p>
    </div>`;
  }
});
</script>
</body>
</html>
