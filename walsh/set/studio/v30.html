<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v30 Slash and void</title>
<meta name="description" content="ANDRÉ MANDEL title block study v30, Slash and void. Territory: Libeskind and Lebbeus Woods, hairline energy.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e5e3dc">
<link rel="icon" href="../../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tenor+Sans&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* v30 · Slash and void · Libeskind and Lebbeus Woods, hairline energy */
.tb .grp{position:absolute;left:calc(var(--u)*.32);right:calc(var(--u)*.26);display:flex;flex-direction:column;gap:calc(var(--u)*.22)}
.tb .grp.b{bottom:calc(var(--u)*.3);gap:calc(var(--u)*.18)}
.tb .s-num .sn{font-size:max(calc(42px*var(--fl)),calc(var(--u)*1.2))}
.ov .h{stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke;fill:none}
.ov .o{fill:var(--accent)}

.ov .void{fill:rgba(27,26,24,.045)}
</style>
</head>
<body>
<div id="desk"><div id="stage"></div></div>
<script src="kit.js"></script>
<script>
KIT.mount({
  no: 'v30', name: 'Slash and void',
  tb: c => `<div class="grp" style="top:${c.U(c.lockBottom - .5 + .34)}">${c.f.project()}${c.f.issued()}${c.f.permits()}${c.f.stamp()}</div>
    <div class="grp b">${c.f.title()}${c.f.number()}${c.f.colo({ firm: true })}</div>`,

  svg: c => {
    const a = [36.05, 9.4], b = [31.2, 16.1], g = .16;
    return `<polygon class="void" points="${a[0]},${a[1]} ${b[0]},${b[1]} ${b[0]},${b[1] + g} ${a[0]},${a[1] + g}"/>
      <line class="h" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke-opacity:.7"/>
      <line class="h" x1="${a[0] - .3}" y1="${a[1] + g + .4 * 0}" x2="${b[0] + .25}" y2="${b[1] + g}" style="stroke-opacity:.4"/>
      <circle class="o" cx="${b[0] + .25}" cy="${b[1] + g}" r=".055"/>`;
  }
});
</script>
</body>
</html>
